<form [formGroup]="form">
  <input placeholder="Email" formControlName="email" />
  <input type="password" placeholder="Password" formControlName="password" />
  <button type="submit" (click)="login()" [disabled]="loading()">
    @if (loading()) {
      <i class="icn-spinner2 spinner"></i>
    } @else {
      Login
    }
  </button>
</form>
