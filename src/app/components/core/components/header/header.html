<header>
  <div class="headerContainer">
    <div class="content">
      <div class="content__left">
        <div class="logo">
          <a routerLink="/home">
            <div class="picture">
              <img src="assets/images/mean-logo.svg" alt="MEAN Mall" />
            </div>
          </a>
        </div>
        @if (availableRoles().length > 1) {
          <div class="role-switch">
            @for (role of availableRoles(); track role) {
              <button
                class="role-switch__item"
                [class.role-switch__item--active]="authService.activeRole() === role"
                (click)="switchRole(role)"
              >
                {{ role }}
              </button>
            }
          </div>
        }
      </div>
      <div class="content__right">
        <nav class="navbar">
          <a routerLink="/home" routerLinkActive="active">Accueil</a>
          <a routerLink="/shops" routerLinkActive="active">Boutiques</a>
          <a routerLink="/cart" routerLinkActive="active">Panier</a>
          <a href="#">Contact</a>
        </nav>
        <div class="header-actions">
          <!-- CART -->
          <div class="cart" routerLink="/cart" [class.bump]="cartBounce()">
            <i class="icn-cart"></i>

            @if (cartService.cartCount() > 0) {
              <span class="cart__badge"></span>
            }
          </div>

          <!-- LOGIN / USER -->
          <div class="login">
            @if (!authService.isLoggedIn()) {
              <button class="loginBtn" (click)="authService.setAuthPopup(true)">
                <i class="icn-switch"></i>
                Login
              </button>
            } @else {
              <div class="welcome">
                Welcome, <span>{{ user()?.firstName }}</span>
                <button class="logoutBtn" (click)="authService.logout()" title="logout">
                  <i class="icn-switch"></i>
                </button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
