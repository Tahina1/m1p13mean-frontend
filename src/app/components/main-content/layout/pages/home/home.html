<main>
  <div class="home">
    <div class="home__header">
      <div class="title">
        <picture>
          <img src="assets/images/shopping_walking.png" alt="girl shopping walking" />
        </picture>
        <div class="promo">
          <h1 class="black">Black</h1>
          <span class="sale">Sales</span>
          <h1 class="friday">Friday</h1>
          <h2 class="caption">
            Enjoy up to <span>50%</span> off your favorite items and discover exclusive Black Friday
            deals across the mall
          </h2>
        </div>
        <button routerLink="/shops" class="shopBtn">Shop now <span class="arrow"></span></button>
      </div>
    </div>

    <section class="stores-section">
      <div class="section-header">
        <h2>Popular Stores</h2>
        <a routerLink="/shops" class="view-all">View all →</a>
      </div>

      <div class="stores-grid">
        @for (store of shops(); track store._id) {
          <a class="store-card" [routerLink]="['/shops', store._id]">
            <div class="store-avatar">
              {{ store.name.charAt(0) }}
            </div>

            <div class="store-content">
              <h3>{{ store.name }}</h3>
              <span>Explore</span>
            </div>
          </a>
        }
      </div>
    </section>
  </div>
