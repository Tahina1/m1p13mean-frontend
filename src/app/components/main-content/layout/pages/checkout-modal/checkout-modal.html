<div class="checkout-modal" [class.open]="isOpen()">
  <div class="overlay" (click)="close()"></div>

  <div class="panel">
    <div class="panel__header">
      <h2>Finaliser commande</h2>
      <p>Veuillez renseigner vos informations</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="checkout-form">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" formControlName="name" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" formControlName="phone" />
      </div>

      <div class="form-group">
        <label>Adresse de livraison</label>
        <textarea rows="3" formControlName="address"></textarea>
      </div>

      <button type="submit" [disabled]="loading()" class="checkout-btn">
        {{ loading() ? 'Validation...' : 'Confirmer commande' }}
      </button>
    </form>
  </div>
</div>
<app-notification-component></app-notification-component>
