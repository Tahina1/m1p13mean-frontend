<div class="products">
  <div class="products__header">
    <div>
      <h2 class="products__title">Produits</h2>
      <p class="products__subtitle">Gérer tous les produits</p>
    </div>

    <button class="products__add-btn" (click)="openCreate()">
      <i class="icn-plus"></i>
      Ajouter produit
    </button>
  </div>

  <div class="filters">
    <input
      type="text"
      placeholder="Rechercher par nom..."
      (input)="searchTerm.set($any($event.target).value)"
    />

    <input
      type="number"
      placeholder="Prix min"
      (input)="minPrice.set($any($event.target).value ? +$any($event.target).value : null)"
    />

    <input
      type="number"
      placeholder="Prix max"
      (input)="maxPrice.set($any($event.target).value ? +$any($event.target).value : null)"
    />

    <select (change)="availability.set($any($event.target).value)">
      <option value="all">Tous</option>
      <option value="active">Actifs</option>
      <option value="inactive">Inactifs</option>
    </select>

    <button class="reset-btn" (click)="resetFilters()">Réinitialiser</button>
  </div>

  <div class="products__card">
    <table class="products__table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Prix</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        @for (product of filteredProducts(); track product._id) {
          <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.price }} Ar</td>

            <td>
              <span
                class="status"
                [class]="product.isActive ? 'status--active' : 'status--inactive'"
              >
                {{ product.isActive ? 'active' : 'inactive' }}
              </span>
            </td>

            <td class="products__actions">
              <button class="icon-btn view">
                <i class="icn-eye"></i>
              </button>

              <button class="icon-btn edit" (click)="openEdit(product)">
                <i class="icn-pencil"></i>
              </button>

              <!-- <button class="icon-btn delete" (click)="deleteProduct(product._id)">
                <i class="icn-bin"></i>
              </button> -->
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-pagination [page]="page()" [totalPages]="totalPages()" (pageChange)="onPageChange($event)">
  </app-pagination>
</div>

<app-edit-product-modal
  [isOpen]="isModalOpen"
  [editProduct]="editingProduct"
  (closeModal)="isModalOpen = false"
  (created)="loadProducts()"
></app-edit-product-modal>
