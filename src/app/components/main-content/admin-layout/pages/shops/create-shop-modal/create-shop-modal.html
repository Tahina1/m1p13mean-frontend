<div class="product-modal" [class.product-modal--open]="isOpen()">
  <div class="product-modal__overlay" (click)="close()"></div>

  <div class="product-modal__panel">
    <div class="product-modal__header">
      <h2 class="product-modal__title">
        {{ mode() === 'create' ? 'Ajouter une boutique' : 'Modifier boutique' }}
      </h2>
      <button class="product-modal__close" (click)="close()">✕</button>
    </div>

    <form class="product-modal__form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="product-modal__group">
        <label>Nom boutique</label>
        <input type="text" formControlName="name" />
      </div>

      <div class="product-modal__group">
        <label>Catégorie</label>
        <input type="text" formControlName="category" />
      </div>

      <div class="product-modal__group">
        <label>Étage</label>
        <input type="text" formControlName="floor" />
      </div>

      <div class="product-modal__group">
        <label>Numéro boutique</label>
        <input type="text" formControlName="shopNumber" />
      </div>

      <div class="product-modal__group">
        <label>Propriétaire</label>
        <select formControlName="ownerId">
          <option value="">Choisir propriétaire</option>
          @for (u of shopUsers(); track u._id) {
            <option [value]="u._id">{{ u.firstName }} {{ u.lastName }} ({{ u.email }})</option>
          }
        </select>
      </div>

      <div class="product-modal__group">
        <label>Galerie</label>
        <input type="file" multiple (change)="onFiles($event)" />
        @if (existingImages().length > 0) {
          <div class="gallery-preview">
            @for (img of existingImages(); track img) {
              <img [src]="img" />
            }
          </div>
        }
      </div>

      @if (mode() === 'edit') {
        <div class="product-modal__group">
          <label>Status</label>
          <select formControlName="status">
            <option value="PENDING">Pending</option>
            <option value="ACTIVE">Active</option>
          </select>
        </div>
      }

      <button class="product-modal__submit" type="submit">
        {{ mode() === 'create' ? 'Créer boutique' : 'Mettre à jour' }}
      </button>
    </form>
  </div>
</div>
